<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Medicine Recommendation System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    .contact-header {
      background-color: #222;
      padding: 60px 0;
      text-align: center;
    }
    .contact-header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    .contact-header p {
      font-size: 1.25rem;
      color: #ccc;
    }
    .contact-section {
      padding: 60px 15px;
    }
    .contact-form {
      background-color: #1a1a1a;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.05);
    }
    .form-control,
    .btn {
      border-radius: 8px;
    }
    .form-control {
      background-color: #222;
      border: 1px solid #444;
      color: #fff;
    }
    .form-control::placeholder {
      color: #999;
    }
    .btn-submit {
      background-color: #28a745;
      border: none;
    }
    .btn-submit:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="{{ url_for('static', filename='img1.jpg') }}" alt="Logo" class="rounded-circle me-2" style="height: 40px;">
      <span class="fs-5 fw-semibold">Health Center</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="/developer">Developer</a></li>
        <li class="nav-item"><a class="nav-link" href="/blog">Blog</a></li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>

<div class="contact-header">
  <h1>Contact Us</h1>
  <p>We'd love to hear from you! Fill out the form below to get in touch.</p>
</div>

<div class="container contact-section">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="contact-form">
        <form action="/submit_contact" method="POST">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.com" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Your Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-submit px-5 py-2">Send Message</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
